name: Build lite-led-plus

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile with devkitpro container
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace devkitpro/devkita64:latest /bin/bash -c "
            set -e
            export DEVKITPRO=/opt/devkitpro
            make -C sysmodule clean && make -C sysmodule
            make -C overlay clean && make -C overlay
          "

      - name: Prepare Atmosphere package
        run: |
          mkdir -p package/atmosphere/contents/0100000000000895/flags
          mkdir -p package/switch/.overlays
          cp products/sysmodule/*.nsp package/atmosphere/contents/0100000000000895/exefs.nsp
          cp sysmodule/toolbox.json package/atmosphere/contents/0100000000000895/toolbox.json
          touch package/atmosphere/contents/0100000000000895/flags/boot2.flag
          cp products/overlay/*.ovl package/switch/.overlays/lite-led-plus.ovl

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lite-led-plus
          path: package/
          include-hidden-files: true
